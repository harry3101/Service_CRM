# All-in-one: DYNAMIC (API) + STATIC-ISH UI (Node serving TanStack) in a single Blueprint.
# Split: deploy render.dynamic.yaml and render.static.yaml in two steps, or use this file for one Blueprint.
# https://render.com/docs/blueprint-spec
#
# === Backend (create FIRST — you need its URL for the frontend build) ===
#   MONGODB_URI          — MongoDB Atlas connection string (database in path, e.g. /service_crm)
#   FIREBASE_PROJECT_ID  — same as Firebase / VITE_FIREBASE_PROJECT_ID (e.g. service-crm-22356)
#   CORS_ALLOW_ONRENDER=1 — allow any https://*.onrender.com (easy demo). Or set CORS_ORIGIN to exact frontend URL only.
#   Optional: FIREBASE_SERVICE_ACCOUNT (JSON one line) for Admin getUser; not required for JWT (JWKS).
#
# === Frontend (set env before build — VITE_* are baked at build time) ===
#   VITE_API_URL — https://<BACKEND-NAME>.onrender.com  (no trailing slash)
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID, VITE_FIREBASE_MEASUREMENT_ID
#
# === Firebase Console → Auth → Settings → Authorized domains: add <frontend>.onrender.com ===

services:
  - type: web
    name: demo-crm-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: CORS_ALLOW_ONRENDER
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  - type: web
    name: demo-crm-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
