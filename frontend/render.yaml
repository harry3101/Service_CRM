# Render Blueprint: https://render.com/docs/blueprint-spec
# Set environment variables in the Render dashboard (do not commit secrets):
#
# Frontend Web Service (this repo, rootDir: frontend)
#   VITE_API_URL = https://<your-backend>.onrender.com
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID, VITE_FIREBASE_MEASUREMENT_ID
#
# Backend Web Service (folder: backend)
#   MONGODB_URI, FIREBASE_PROJECT_ID, CORS_ORIGIN = https://<your-frontend>.onrender.com
#   Optional: FIREBASE_SERVICE_ACCOUNT (JSON string)

services:
  - type: web
    name: service-center-crm-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
